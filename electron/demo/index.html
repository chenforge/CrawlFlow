<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市观察 · 采集练习站</title><style>body{font:13px/1.6 "Microsoft YaHei",sans-serif;background:#f7f9fc;color:#233047;max-width:1180px;margin:0 auto;padding:22px 28px}*{box-sizing:border-box}.site-nav{display:flex;align-items:center;justify-content:space-between;margin:0;padding:0 0 16px;border-bottom:1px solid #e5eaf0}.site-brand{font-size:19px;font-weight:750;letter-spacing:-.5px;color:#172b44}.site-brand span{font-size:9px;letter-spacing:1.3px;color:#8994a5;margin-left:12px}.site-links{display:flex;gap:24px;font-size:11px;color:#7b8798}.demo-badge{font-size:10px;padding:4px 9px;border-radius:5px;background:#eaf2ff;color:#4271b7;border:1px solid #d6e4fa}header{margin:22px 0 20px}header small{font-size:10px;color:#8090a8;letter-spacing:1px}h1{font-size:29px;letter-spacing:-.7px;margin:3px 0 6px;line-height:1.35}header p{font-size:11px;margin:0;color:#7a8799}a{color:#244d79;text-decoration:none}p{color:#778497}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{background:white;padding:14px;border-radius:9px;border:1px solid #e3e8ef;overflow:hidden;box-shadow:0 3px 12px #24384b04}article img{display:block;width:calc(100% + 28px);height:145px;object-fit:cover;margin:-14px -14px 12px}article:nth-child(2) img{filter:hue-rotate(26deg)}article:nth-child(3) img{filter:hue-rotate(330deg) saturate(.75)}article:nth-child(4) img{filter:hue-rotate(55deg) saturate(.7)}h2{font-size:15px;margin:13px 0 8px;line-height:1.5}article h2{font-size:16px;line-height:1.5;margin:0 0 8px;min-height:48px;letter-spacing:-.3px}article h2 a{color:#26364a}article p{font-size:11px;line-height:1.7;margin:0 0 12px;min-height:37px}article small{font-size:9px;color:#96a0ad}nav{display:flex;gap:16px;align-items:center;margin:14px 0}nav a{font-size:10px;padding:5px 11px;border:1px solid #dce4ee;border-radius:5px;background:white}#pagination{justify-content:center;height:31px;color:#8390a0;font-size:10px}#pagination a{color:#376ca8}small{color:#8692a1}table{width:100%;border-collapse:collapse;background:white;font-size:10px;border:1px solid #e1e7ef}th,td{text-align:left;padding:7px 12px;border-bottom:1px solid #e9edf3}th{font-weight:600;color:#627188;background:#f1f5fa}body>nav:last-of-type{justify-content:flex-end;margin:11px 0 0}body>h2{font-size:13px;font-weight:600;margin-top:8px}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr))}.site-links{display:none}}</style><nav class="site-nav"><div class="site-brand">城市观察<span>URBAN JOURNAL</span></div><div class="site-links"><span>发现生活</span><span>街区故事</span><span>周末灵感</span></div><span class="demo-badge">公开示例网页 · CrawlFlow</span></nav><header><small>DAILY INSPIRATION · 城市生活灵感</small><h1>发现城市里的小美好</h1><p>这是随应用附带的示例网页。内容会在打开后动态加载，适合练习文章、链接、图片和翻页采集。</p></header><main id="articles"></main><nav id="pagination"></nav><h2>本周活动一览</h2><table><thead><tr><th>活动</th><th>地点</th><th>人数</th></tr></thead><tbody><tr><td>社区花园开放日</td><td>南街花园</td><td>32</td></tr><tr><td>周末旧书交换</td><td>林间书屋</td><td>45</td></tr></tbody></table><nav><a href="/private">练习登录后的页面</a></nav><script>const stories=[['街角咖啡馆，把清晨留给一杯手冲','街区里的独立小店，以烘焙香气和温暖的问候开启新的一天。'],['一条河岸步道，连接城市与自然','沿着滨河步道散步，观察四季植物与鸟类，发现日常里的自然之美。'],['周末去旧书店，寻找意外的相遇','书架上的手写便笺，让一本旧书连接两个陌生人的生活。'],['社区花园的第一场秋日丰收','居民一起播种与浇水，让闲置空间变成可以共享的小花园。'],['骑行十公里，看见另一面的城市','从老城区出发，沿途记录熟悉街道上常常被忽略的小细节。'],['博物馆夜游，走进有故事的灯光','夜间开放为博物馆带来新的节奏，展品与城市记忆相互映照。'],['给生活留白：一堂周末陶艺课','在泥土和双手之间，练习耐心，也找到属于自己的创作节奏。'],['早市的颜色，是城市醒来的信号','摊主的吆喝、蔬菜的露水和热腾腾的早餐，构成真实的日常。'],['把屋顶变成一座小小的花园','从第一盆薄荷开始，让身边的空间多一点绿色和生机。'],['探访老街：留住建筑里的记忆','旧门牌和磨光的台阶，记录着一个街区缓慢生长的故事。'],['一起修理，让旧物再次被珍惜','社区修理工作坊分享工具与技能，也分享人与人之间的信任。'],['落日之后，城市音乐继续发生','小型现场演出把来自不同角落的人聚在一起，共享一个夜晚。']];const params=new URLSearchParams(location.search);const page=Math.max(1,Math.min(3,Number(params.get('page'))||1));setTimeout(()=>{document.querySelector('#articles').innerHTML=stories.slice((page-1)*4,page*4).map((story,i)=>`<article class="story-card"><img src="/image.svg?item=${(page-1)*4+i}" alt="${story[0]}"><h2 class="story-title"><a href="/article?id=${(page-1)*4+i+1}">${story[0]}</a></h2><p class="story-summary">${story[1]}</p><small>城市观察 · 2026-10-${String(page+i).padStart(2,'0')}</small></article>`).join('');document.querySelector('#pagination').innerHTML=`<span>第 ${page} / 3 页</span>`+(page<3?`<a rel="next" href="/?page=${page+1}">下一页 →</a>`:'<span>已经是最后一页</span>');},200);</script></html>
